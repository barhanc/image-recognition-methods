[project]
name = "image-recognition-methods"
version = "0.1.0"
description = "Computer vision, deep generative modeling, and image recognition methods"
authors = [
    { name = "Bartosz Hanc", email = "bartosz.hanc02@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "optuna>=3.6",
    "pandas>=2.2",
    "pillow>=10.2",
    "tinygrad>=0.9.0",
    "torch>=2.2",
    "torchview>=0.2.6",
    "torchvision>=0.17",
    "tqdm>=4.66",
    "ultralytics>=8.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
